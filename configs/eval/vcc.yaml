# @package _global_
#
# VCC/PARSE external evaluation config.
# Usage:
#   python -m workflows.eval.main --config-name eval/vcc \
#       sample_dir=/path/to/sample_dir \
#       "metrics=[vcc_test]"

defaults:
  - /eval_schema
  - _self_

name: eval
device: auto

sample_dir: ""
real_data: ""
gene_id_name_file: ""
convert_ensembl_to_name: false
num_samples: 10000
seed: 42

metrics:
  - vcc_test

external:
  vcc_val:
    predict_filename: merged_with_control.h5ad
    params:
      _target_: src.modules.evaluators.external.vcc_score.VCCScoreParams
      script_name: VCC_Score_general_VCC_Val.sh
      conda_env: ""
      threads: 40
  vcc_test:
    predict_filename: merged_with_control.h5ad
    params:
      _target_: src.modules.evaluators.external.vcc_score.VCCScoreParams
      script_name: VCC_Score_general_VCC_Test.sh
      conda_env: ""
      threads: 40
  parse_cond_val:
    predict_filename: all_samples_lowerbound_for_cell_eval.h5ad
    params:
      _target_: src.modules.evaluators.external.vcc_score.VCCScoreParams
      script_name: PARSE_Cell_Eval_genera_Val_set.sh
      conda_env: ""
      threads: 40
      donor_id: ""
  parse_cond_test:
    predict_filename: all_samples_lowerbound_for_cell_eval.h5ad
    params:
      _target_: src.modules.evaluators.external.vcc_score.VCCScoreParams
      script_name: PARSE_Cell_Eval_genera_Test_set.sh
      conda_env: ""
      threads: 40
      donor_id: ""
